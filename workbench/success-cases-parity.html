<!doctype html>
<html lang="es">
<head>

  <link rel="stylesheet" href="../src/styles/uhura-system.css">
  <style>
    body {
      margin: 0;

      background: linear-gradient(135deg, #f2ecff 0%, #fbf8ff 52%, #f0f4ff 100%);
      font-family: var(--font-sans);
    }
    .parity-note {
      padding-top: 48px;

    }

      line-height: 1;
      letter-spacing: -.04em;
    }
    .parity-note p {
      max-width: 720px;

    }
    .parity-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .parity-links a {

      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(80,31,146,.16);
      color: #17131f;
      text-decoration: none;

      letter-spacing: .12em;
      text-transform: uppercase;
