<head>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/uhura-system.css">
  <style>
    body.contact-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 78% 12%, rgba(75,229,255,.14), transparent 36%),
        radial-gradient(ellipse at 14% 18%, rgba(138,77,255,.28), transparent 44%),
        linear-gradient(145deg, var(--uhura-dark) 0%, #080512 54%, #07101a 100%);
    }

    .contact-main {
      position: relative;
      isolation: isolate;
      overflow: clip;
    }

    .contact-main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(201,183,255,.034) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,183,255,.03) 1px, transparent 1px);
      background-size: 86px 86px;
      opacity: .34;
      pointer-events: none;
    }

    .contact-form-panel {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      border-color: rgba(201,183,255,.18);
      background:
        radial-gradient(ellipse at 16% 0%, rgba(138,77,255,.20), transparent 38%),
        radial-gradient(ellipse at 88% 12%, rgba(75,229,255,.12), transparent 34%),
        rgba(12,8,24,.72);
    }

    .contact-form-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(201,183,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,183,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .42;
      pointer-events: none;
    }

    .hubspot-form-shell {
      position: relative;
      z-index: 1;
    }

    .hubspot-form-shell .hs-form-frame {
      width: 100%;
      min-height: 540px;
    }

    .hubspot-form-shell iframe {
      width: 100% !important;
      min-height: 540px !important;
      border: 0;
      background: transparent;
    }

    .hubspot-form-shell form {
      display: grid;
      gap: var(--space-4);
      margin: 0;
    }

    .hubspot-form-shell label,
    .hubspot-form-shell legend,
    .hubspot-form-shell .hs-form-field > label,
    .hubspot-form-shell .hs-form-field > label span,
    .hubspot-form-shell .hs-form-field label span,
    .hubspot-form-shell .hs-form-field .hs-form-label,
    .hubspot-form-shell .hs-form-field .hs-form-label span,
    .hubspot-form-shell .hs-form-field .input label,
    .hubspot-form-shell .legal-consent-container label,
    .hubspot-form-shell .legal-consent-container label span {
      display: block;
      margin-block-end: var(--space-2);
      color: rgba(255,255,255,.94) !important;
      font-family: var(--font-primary);
      font-weight: 700;
      text-transform: uppercase;
    }

    .hubspot-form-shell .hs-field-desc,
    .hubspot-form-shell .hs-richtext,
    .hubspot-form-shell .hs-richtext p,
    .hubspot-form-shell .inputs-list label,
    .hubspot-form-shell .inputs-list span,
    .hubspot-form-shell .hs-dependent-field label,
    .hubspot-form-shell .hs-dependent-field span {
      color: rgba(255,255,255,.74) !important;
    }

    .hubspot-form-shell .hs-form-required {
      color: var(--uhura-lime) !important;
    }

    .hubspot-form-shell input,
    .hubspot-form-shell textarea,
    .hubspot-form-shell select {
      width: 100% !important;
      min-height: 52px;
      padding: 14px 16px;
      border: 1px solid rgba(201,183,255,.18);
      border-radius: var(--component-icon-tile-radius);
      background: rgba(255,255,255,.055);
      color: var(--uhura-white);
      font: inherit;
      outline: none;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .hubspot-form-shell input::placeholder,
    .hubspot-form-shell textarea::placeholder {
      color: rgba(255,255,255,.42);
    }

    .hubspot-form-shell textarea {
      min-height: 132px;
      resize: vertical;
    }

    .hubspot-form-shell input:focus,
    .hubspot-form-shell textarea:focus,
    .hubspot-form-shell select:focus {
      border-color: rgba(212,255,74,.66);
      background: rgba(255,255,255,.08);
      box-shadow: 0 0 0 3px rgba(212,255,74,.10);
    }

    .hubspot-form-shell .hs-error-msgs,
    .hubspot-form-shell .hs-error-msg {
      margin: var(--space-2) 0 0;
      color: var(--uhura-lime);
      font: inherit;
    }

    .hubspot-form-shell .hs-button,
    .hubspot-form-shell input[type="submit"] {
      width: auto !important;
      min-height: auto;
      justify-self: start;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: var(--uhura-lime);
      color: var(--uhura-ink);
      font-family: var(--font-primary);
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(212,255,74,.18);
    }

    .hubspot-form-shell .submitted-message {
      color: rgba(255,255,255,.78);
    }

    @media (max-width: 980px) {
      .contact-form-panel { min-height: 340px; }
      .hubspot-form-shell .hs-form-frame,
      .hubspot-form-shell iframe {
        min-height: 620px !important;
      }
    }
  </style>
</head>
<body class="page-dark contact-page">
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PZ35GMR9"
  height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
  <div id="uhura-nav-root" data-uhura-nav></div>
  <main class="contact-main">
    <section class="hero-base" aria-labelledby="contact-title">
      <div class="hero-base__shell">
        <div class="hero-base__grid">
          <div class="hero-base__copy">
            <div class="hero-base__story">
              <p class="eyebrow">Contacto</p>
              <h1 id="contact-title" class="hero-base__title">Hablemos de lo que quieres hacer <span class="italic">crecer.</span></h1>
              <p class="hero-base__body">Cuéntanos qué quieres construir, optimizar o escalar. Volvemos con una conversación clara para entender el reto, la etapa y el siguiente movimiento.</p>
            </div>
          </div>
          <div class="hero-base__media">
            <div class="panel-dark panel-roomy contact-form-panel" aria-label="Formulario de contacto">
              <div id="hubspot-contact-form" class="hubspot-form-shell">
                <div class="hs-form-frame" data-region="na1" data-form-id="dccaa1b8-d1c9-40aa-9b40-0fbb0770d630" data-portal-id="20846814"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="uhura-footer-root" data-uhura-footer></div>
  <script src="../src/config/services.js"></script>
  <script src="../src/extracted/global-nav-sync.js"></script>
  <script src="../src/extracted/footer-sync.js"></script>
  <script src="https://js.hsforms.net/forms/embed/20846814.js" defer></script>
  <script>
    function applyHubspotContrastStyles() {
      const css = `
        label, legend, .hs-form-field > label, .hs-form-field > label span,
        .hs-form-field .hs-form-label, .hs-form-field .hs-form-label span {
          color: rgba(255,255,255,.94) !important;
          font-family: Montserrat, sans-serif !important;
          font-weight: 700 !important;
          text-transform: uppercase !important;
        }
        .hs-richtext, .hs-richtext p, .hs-field-desc, .inputs-list label, .inputs-list span {
          color: rgba(255,255,255,.74) !important;
        }
        .hs-form-required { color: #d4ff4a !important; }
      `;
      const mountStyle = (root) => {
        if (!root || root.querySelector("[data-uhura-hubspot-contrast]")) return;
        const style = document.createElement("style");
        style.dataset.uhuraHubspotContrast = "true";
        style.textContent = css;
        root.appendChild(style);
      };
      mountStyle(document.getElementById("hubspot-contact-form"));
      document.querySelectorAll("#hubspot-contact-form iframe").forEach((frame) => {
        try {
          mountStyle(frame.contentDocument?.head);
        } catch (error) {
          frame.classList.add("hubspot-form-iframe");
        }
      });
    }

    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "hsFormCallback") return;
      if (event.data.eventName === "onFormReady") {
        applyHubspotContrastStyles();
      }
      if (event.data.eventName === "onFormSubmitted") {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: "hubspot_form_success",
          form_id: "dccaa1b8-d1c9-40aa-9b40-0fbb0770d630"
        });
      }
    });

    window.addEventListener("load", function () {
      applyHubspotContrastStyles();
      [300, 900, 1800].forEach(function (delay) {
        window.setTimeout(function () {
          applyHubspotContrastStyles();
        }, delay);
      });
    });
  </script>
</body>
</html>
